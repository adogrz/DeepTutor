# ============================================
# DeepTutor Docker Compose Configuration (Dokploy Edition)
# ============================================

services:
  # ============================================
  # All-in-One DeepTutor Service
  # ============================================
  deeptutor:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - BACKEND_PORT=${BACKEND_PORT:-8001}
    container_name: deeptutor
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8001}:${BACKEND_PORT:-8001}"
      - "${FRONTEND_PORT:-3782}:${FRONTEND_PORT:-3782}"

    # Load environment variables from .env file
    env_file:
      - .env

    environment:
      # LLM Configuration
      - LLM_BINDING=${LLM_BINDING:-openai}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_BINDING_API_KEY=${LLM_BINDING_API_KEY}
      - LLM_BINDING_HOST=${LLM_BINDING_HOST}
      - DISABLE_SSL_VERIFY=${DISABLE_SSL_VERIFY:-false}
      
      # Embedding Configuration
      - EMBEDDING_BINDING=${EMBEDDING_BINDING:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-large}
      - EMBEDDING_BINDING_API_KEY=${EMBEDDING_BINDING_API_KEY}
      - EMBEDDING_BINDING_HOST=${EMBEDDING_BINDING_HOST}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-3072}
      - EMBEDDING_MAX_TOKENS=${EMBEDDING_MAX_TOKENS:-8192}
      
      # TTS & Search (Optional)
      - TTS_MODEL=${TTS_MODEL:-}
      - TTS_API_KEY=${TTS_API_KEY:-}
      - TTS_URL=${TTS_URL:-}
      - TTS_VOICE=${TTS_VOICE:-alloy}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      
      # Logging & System
      - RAG_TOOL_MODULE_LOG_LEVEL=${RAG_TOOL_MODULE_LOG_LEVEL:-INFO}
      - BACKEND_PORT=${BACKEND_PORT:-8001}
      - FRONTEND_PORT=${FRONTEND_PORT:-3782}
      - NEXT_PUBLIC_API_BASE_EXTERNAL=${NEXT_PUBLIC_API_BASE_EXTERNAL:-}

    # --- CAMBIO CRÍTICO: VOLÚMENES GESTIONADOS ---
    volumes:
      # Volumen para configuración (Lectura/Escritura)
      # Docker copiará los archivos predeterminados aquí al iniciar
      - deeptutor_config:/app/config
      
      # Volumen para todos los datos (User data, Logs, Knowledge Bases)
      - deeptutor_data:/app/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-8001}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - deeptutor-network

# ============================================
# Volumes Definition
# ============================================
volumes:
  deeptutor_config:
  deeptutor_data:

# ============================================
# Networks
# ============================================
networks:
  deeptutor-network:
    driver: bridge
